name: iOS self-test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['source/**', 'ci/**', 'build.json', '.github/workflows/ios.yml']

permissions:
  contents: read

concurrency:
  group: ios-self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository_id == '1435778522' && github.actor_id == '129140237' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
      PUB_HOSTED_URL: https://pub.dev
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Cache official Flutter SDK
        id: flutter-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/lumapocket-flutter
          key: flutter-ios-${{ runner.os }}-${{ runner.arch }}-3.47.2
      - name: Install pinned Flutter SDK
        run: python3 ci/setup_flutter.py
      - name: Save installed Flutter SDK
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/lumapocket-flutter
          key: flutter-ios-${{ runner.os }}-${{ runner.arch }}-3.47.2
      - name: Cache Rust downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-downloads-${{ runner.os }}-${{ runner.arch }}-1-${{ hashFiles('build.json') }}
          restore-keys: rust-downloads-${{ runner.os }}-${{ runner.arch }}-1-
      - name: Decrypt isolated source and prepare mobile project
        env:
          SOURCE_PASSPHRASE: ${{ secrets.BUILD_SOURCE_PASSPHRASE }}
        run: bash ci/decrypt_source.sh
      - name: Build ARM64 unsigned iOS application
        run: bash ci/build_ios.sh
      - name: Upload personal signing package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LumaPocket-iOS-unsigned
          path: ${{ runner.temp }}/lumapocket-out/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  publish:
    needs: build
    if: github.repository_id == '1435778522' && github.actor_id == '129140237' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Publish verified unsigned files for personal signing repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/publish_unsigned.py
