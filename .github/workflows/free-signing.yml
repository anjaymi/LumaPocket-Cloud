name: Free signing experiment

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [validate, renew]
        default: validate
        description: Validate tooling, or renew using an authorized encrypted state
      reset_state:
        type: boolean
        default: false
        description: Use the newly uploaded bootstrap state instead of the previous run
  push:
    branches: [main]
    paths: ['signing/**', '.github/workflows/free-signing.yml']
  schedule:
    - cron: '37 2 * * *'

permissions:
  contents: read

concurrency:
  group: free-signing-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository_owner == github.actor && (github.event_name == 'push' || inputs.mode == 'validate')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Check frozen signing tool without an Apple account
        run: python signing/check.py
      - name: Verify public build feed from this personal repository
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python signing/check_public_feed.py
      - name: Upload tool verification only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Signing-tool-check-${{ runner.os }}
          path: ${{ runner.temp }}/lumapocket-signing-check-out/*.json
          if-no-files-found: error
          retention-days: 7
  renew:
    if: github.repository_id != '1435778522' && github.repository_owner == github.actor && github.ref == 'refs/heads/main' && github.repository_id == vars.SIGNING_REPOSITORY_ID && github.repository_owner_id == vars.SIGNING_OWNER_ID && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'renew') || (github.event_name == 'schedule' && vars.FREE_SIGNING_ENABLED == 'true'))
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Renew free profile and verify signed app
        id: renew
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IOS_SIGNING_PASSPHRASE: ${{ secrets.IOS_SIGNING_PASSPHRASE }}
          IOS_SIGNING_STATE_BASE64: ${{ secrets.IOS_SIGNING_STATE_BASE64 }}
          RESET_SIGNING_STATE: ${{ inputs.reset_state || false }}
          SIGNING_REPOSITORY_ID: ${{ vars.SIGNING_REPOSITORY_ID }}
          SIGNING_OWNER_ID: ${{ vars.SIGNING_OWNER_ID }}
        run: python signing/ci_renew.py
      - name: Upload encrypted signing files
        if: always() && steps.renew.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LumaPocket-free-sign
          path: ${{ runner.temp }}/lumapocket-signing-out/*
          if-no-files-found: error
          retention-days: 10
          compression-level: 0
